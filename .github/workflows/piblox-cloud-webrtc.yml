name: PIblox Cloud WebRTC checks

on:
  push:
    branches:
      - main
      - feature/piblox-cloud-prototype
    paths:
      - "services/piblox-cloud/**"
      - ".github/workflows/piblox-cloud-webrtc.yml"
  pull_request:
    paths:
      - "services/piblox-cloud/**"
      - ".github/workflows/piblox-cloud-webrtc.yml"
  workflow_dispatch:

jobs:
  local-webrtc-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/piblox-cloud
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/piblox-cloud/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run WebRTC API tests
        run: python -m unittest discover -s tests -v
