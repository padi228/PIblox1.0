name: PIblox Cloud tests

on:
  pull_request:
    paths:
      - "services/piblox-cloud/**"
      - "docs/PIBLOX_CLOUD.md"
      - ".github/workflows/piblox-cloud.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/piblox-cloud
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
